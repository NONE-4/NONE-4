    <text x="600" y="172" fill="url(#neon)" font-size="68" font-weight="800" letter-spacing="8" filter="url(#glow)">AI / MLOps</text>
    <text x="600" y="210" fill="#dbe7ff" font-size="18" letter-spacing="4">BUILD • TRAIN • DEPLOY • MONITOR</text>
