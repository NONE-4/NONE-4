    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2d55a5" stroke-opacity=".22"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
